# Canonical association: ChargeDispositionAssociation
#
# Spec §4.1, §4.6. How a count ended.
#
# A platform extension, and the reason is worth stating rather than apologising for. NIEM models a
# disposition as a component *inside* j:ChargeType -- j:ChargeDisposition -- which is correct for a
# document describing a charge at a moment in time. It is wrong for a platform that holds both
# records continuously, because the two arrive separately: the arresting agency reports the charge
# and the clerk of court reports the disposition, months later, on a different feed, and often
# amends it afterwards.
#
# Nesting would mean every disposition and every amendment is a rewrite of a record another agency
# owns, which destroys the lineage of both. An edge keeps each side owned by whoever reported it.

type: ChargeDispositionAssociation
kind: association
namespace: "https://niemplatform.gov/canonical/extension/1.0"
version: "1.0.0"
doc: "Links a charge to the disposition that closed it."

extension:
  justification: >
    NIEM 6.0 nests disposition within j:ChargeType rather than relating them, which suits a
    point-in-time exchange document and not a platform that holds both records as they arrive from
    different reporting organisations at different times. Modelled as an association so that the
    charge and its disposition each keep the provenance of the agency that reported it, and so that
    an amended disposition replaces an edge rather than rewriting the arresting agency's charge.

roles:
  - name: charge
    target: Charge
    doc: "The charge that was disposed of."
    provenance:
      niemNamespace: "https://docs.oasis-open.org/niemopen/ns/model/domains/justice/6.0/"
      niemElement: "j:Charge"

  - name: disposition
    target: Disposition
    doc: "The outcome."
    provenance:
      niemNamespace: "https://docs.oasis-open.org/niemopen/ns/model/niem-core/6.0/"
      niemElement: "nc:Disposition"
