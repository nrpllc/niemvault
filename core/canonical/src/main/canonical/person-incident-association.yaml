# Canonical type: PersonIncidentAssociation
#
# Spec §4.1, §4.6. NIEM-sourced, verified against the NIEM 6.0 release manifest.
#
# This was modelled as a platform extension until the references could be checked, on the grounds
# that NIEM plainly had the machinery but we could not cite the exact type and a guessed provenance
# is worse than none. With the release on disk, the type is nc:ActivityPersonAssociationType --
# "a data type for an association between an activity and a person" -- and nc:IncidentType extends
# nc:ActivityType, so an incident *is* an activity and this is that association exactly.
#
# See docs/decisions/0011-niem-reference-verification.md.

type: PersonIncidentAssociation
kind: association
namespace: "https://niemplatform.gov/canonical/core/1.0"
version: "1.0.0"
doc: "Links a person to an incident in a stated role, e.g. victim, suspect, witness."

provenance:
  niemNamespace: "https://docs.oasis-open.org/niemopen/ns/model/niem-core/6.0/"
  niemType: "nc:ActivityPersonAssociationType"

roles:
  - name: person
    target: Person
    doc: "The person involved in the incident."
    provenance:
      niemNamespace: "https://docs.oasis-open.org/niemopen/ns/model/niem-core/6.0/"
      niemElement: "nc:Person"

  - name: incident
    target: Incident
    doc: "The incident the person is involved in."
    # The activity endpoint of the association. An incident is an activity in NIEM:
    # nc:IncidentType extends nc:ActivityType.
    provenance:
      niemNamespace: "https://docs.oasis-open.org/niemopen/ns/model/niem-core/6.0/"
      niemElement: "nc:Activity"

fields:
  - name: involvementCode
    type: code
    required: true
    codeList: ["VICTIM", "SUSPECT", "WITNESS", "REPORTING_PARTY", "OTHER"]
    doc: "How the person was involved in the incident."
    # nc:ActivityInvolvementAbstract is the association's own substitution point for exactly this:
    # "a data concept for a description of the involvement of an entity in an activity". A code
    # substituting for an abstract is NIEM's normal pattern, so this is provenance rather than a
    # deviation.
    #
    # The deviation that remains is one of granularity, not of provenance: the justice domain also
    # models victim, subject and witness as distinct association types, and collapsing them to a
    # code on one association keeps the Phase 1 slice to a single association type. Splitting them
    # is a content-version migration, not a platform change.
    provenance:
      niemNamespace: "https://docs.oasis-open.org/niemopen/ns/model/niem-core/6.0/"
      niemElement: "nc:ActivityInvolvementAbstract"
