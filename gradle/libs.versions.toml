# Version catalogue. Air-gapped delivery (spec §6) means every dependency here must be
# mirrorable into an offline repository -- no dynamic versions, no snapshots.
[versions]
java              = "21"
flink             = "1.20.1"
jackson           = "2.18.2"
snakeyaml         = "2.3"
neo4jDriver       = "5.28.5"
kafkaClients      = "3.9.0"
sshd              = "2.18.0"
commonsNet        = "3.13.0"
ftpserver         = "1.2.1"
parquet           = "1.15.0"
avro              = "1.12.0"
hadoop            = "3.4.1"
iceberg           = "1.7.1"
awsSdk            = "2.29.52"
h2                = "2.3.232"
picocli           = "4.7.6"
slf4j             = "2.0.16"
logback           = "1.5.15"
junit             = "5.11.4"
assertj           = "3.27.0"
testcontainers    = "1.21.4"

[libraries]
# --- Flink (runtime engine, spec §2 / §5) ---
flink-core                 = { module = "org.apache.flink:flink-core",                 version.ref = "flink" }
flink-streaming-java       = { module = "org.apache.flink:flink-streaming-java",       version.ref = "flink" }
flink-clients              = { module = "org.apache.flink:flink-clients",              version.ref = "flink" }
flink-connector-files      = { module = "org.apache.flink:flink-connector-files",      version.ref = "flink" }
flink-test-utils           = { module = "org.apache.flink:flink-test-utils",           version.ref = "flink" }
# Flink's own job-graph dashboard. Optional at runtime: a cluster deployment already has one, and
# an operator running embedded only wants it when they are watching.
flink-runtime-web          = { module = "org.apache.flink:flink-runtime-web",          version.ref = "flink" }
flink-runtime-tests        = { module = "org.apache.flink:flink-runtime",              version.ref = "flink" }

# --- Serialisation / config ---
jackson-databind           = { module = "com.fasterxml.jackson.core:jackson-databind",              version.ref = "jackson" }
jackson-datatype-jsr310    = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310",   version.ref = "jackson" }
jackson-dataformat-yaml    = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
snakeyaml                  = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }

# --- Storage ---
parquet-hadoop             = { module = "org.apache.parquet:parquet-hadoop", version.ref = "parquet" }
parquet-avro               = { module = "org.apache.parquet:parquet-avro",   version.ref = "parquet" }
avro                       = { module = "org.apache.avro:avro",              version.ref = "avro" }
# Parquet's API references Hadoop Configuration even when writing through a pure-NIO OutputFile.
# hadoop-common is therefore a compile dependency; no Hadoop FileSystem is used at runtime.
hadoop-common              = { module = "org.apache.hadoop:hadoop-common",   version.ref = "hadoop" }
# ParquetReadOptions statically references a MapReduce input format class. Never invoked; the
# class merely has to resolve. Pulled in for that reason alone.
hadoop-mapreduce-core      = { module = "org.apache.hadoop:hadoop-mapreduce-client-core", version.ref = "hadoop" }

# --- Canonical silver table format (ADR 0005, spec permits Delta Lake or Iceberg) ---
iceberg-core               = { module = "org.apache.iceberg:iceberg-core",    version.ref = "iceberg" }
iceberg-api                = { module = "org.apache.iceberg:iceberg-api",     version.ref = "iceberg" }
iceberg-data               = { module = "org.apache.iceberg:iceberg-data",    version.ref = "iceberg" }
iceberg-parquet            = { module = "org.apache.iceberg:iceberg-parquet", version.ref = "iceberg" }
iceberg-aws                = { module = "org.apache.iceberg:iceberg-aws",     version.ref = "iceberg" }
# S3FileIO speaks HTTP to an object store, so the silver path needs no Hadoop FileSystem and no
# winutils.exe on Windows. See ADR 0005.
aws-s3                     = { module = "software.amazon.awssdk:s3",          version.ref = "awsSdk" }
aws-url-connection-client  = { module = "software.amazon.awssdk:url-connection-client", version.ref = "awsSdk" }
# Iceberg's AwsProperties references STS model classes even when no role is assumed, so the
# dependency is required for S3FileIO to initialise at all.
aws-sts                    = { module = "software.amazon.awssdk:sts", version.ref = "awsSdk" }
h2                         = { module = "com.h2database:h2",                  version.ref = "h2" }

# --- Connectors ---
# The plain client, not a Flink Kafka connector: landing goes through LandingService like every
# other transport (spec §4.3), so the engine never sees a topic.
kafka-clients              = { module = "org.apache.kafka:kafka-clients", version.ref = "kafkaClients" }

# SFTP. Apache MINA sshd rather than JSch: Apache-licensed, actively released, and it ships an
# embeddable server, so the connector's tests speak real SFTP over a loopback socket instead of
# mocking the protocol they exist to exercise. sshd-sftp pulls sshd-core transitively; both are
# declared so the compile classpath states what it uses.
sshd-core                  = { module = "org.apache.sshd:sshd-core", version.ref = "sshd" }
sshd-sftp                  = { module = "org.apache.sshd:sshd-sftp", version.ref = "sshd" }

# FTPS. Apache commons-net is the only maintained Java FTP client worth shipping, and FTPS is FTP
# with TLS rather than a separate protocol, so the same client speaks both. Plain FTP comes with it
# and is why the connector makes using it an explicit, written-down choice (ADR 0033).
commons-net                = { module = "commons-net:commons-net", version.ref = "commonsNet" }
# Test-only: a real FTP server, so the FTPS connector's tests speak the protocol rather than a
# mock of it. The failures worth catching -- a transfer the server reports failed after the data
# connection closed cleanly, a listing timestamp with no year -- exist only in a real server.
ftpserver-core             = { module = "org.apache.ftpserver:ftpserver-core", version.ref = "ftpserver" }

# --- Projections ---
neo4j-driver               = { module = "org.neo4j.driver:neo4j-java-driver", version.ref = "neo4jDriver" }

# --- CLI ---
picocli                    = { module = "info.picocli:picocli",           version.ref = "picocli" }
picocli-codegen            = { module = "info.picocli:picocli-codegen",   version.ref = "picocli" }

# --- Logging ---
slf4j-api                  = { module = "org.slf4j:slf4j-api",              version.ref = "slf4j" }
logback-classic            = { module = "ch.qos.logback:logback-classic",   version.ref = "logback" }

# --- Test ---
junit-bom                  = { module = "org.junit:junit-bom",                 version.ref = "junit" }
junit-jupiter              = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher    = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core               = { module = "org.assertj:assertj-core",            version.ref = "assertj" }
testcontainers-bom         = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit       = { module = "org.testcontainers:junit-jupiter" }
testcontainers-neo4j       = { module = "org.testcontainers:neo4j" }
testcontainers-minio       = { module = "org.testcontainers:minio" }
testcontainers-kafka       = { module = "org.testcontainers:kafka" }

[bundles]
jackson = ["jackson-databind", "jackson-datatype-jsr310", "jackson-dataformat-yaml"]
flink-embedded = ["flink-core", "flink-streaming-java", "flink-clients"]
